name: Swarm Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-asyncio pyyaml
      
      - name: Validate opencode.json
        run: |
          python3 -c "
          import json
          with open('opencode.json') as f:
              config = json.load(f)
          print(f'Agents: {len(config[\"agent\"])}')
          for name, agent in config['agent'].items():
              assert 'model' in agent, f'{name} missing model'
              assert 'skills' in agent, f'{name} missing skills'
          print('✅ opencode.json valid')
          "
      
      - name: Run routing verification
        run: python3 test_swarm_routing.py
      
      - name: Run unit tests
        run: |
          python3 -m pytest tests/unit/ -v --tb=short 2>/dev/null || echo "No unit tests yet"

  e2e-test:
    name: E2E Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11.3
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_NO_ANALYTICS: 'true'
        options: >-
          --health-cmd="curl -f http://localhost:7700/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-asyncio pyyaml
      
      - name: Start vault server
        run: |
          python3 vault_server.py &
          sleep 3
          curl -f http://localhost:27123/health
      
      - name: Test vault integration
        run: |
          python3 -c "
          from vault_client import get_vault_client
          client = get_vault_client()
          assert client.health_check(), 'Vault server not healthy'
          files = client.list_files()
          print(f'Vault files: {len(files)}')
          print('✅ Vault integration works')
          "
      
      - name: Test swarm core imports
        run: |
          python3 -c "
          from swarm.core import (
              AgentRouter, ModelRegistry, DAGBuilder, TaskClassifier,
              AgentBus, AgentStateMachine, AutoVerdictEngine,
              MemoryEngine, ConfigLoader
          )
          print('✅ All swarm.core modules import successfully')
          
          # Test basic functionality
          classifier = TaskClassifier()
          result = classifier.classify('Build a REST API with authentication')
          print(f'Task type: {result.task_type.value}, complexity: {result.complexity}')
          
          registry = ModelRegistry()
          model = registry.get_primary_model('architect')
          print(f'Primary model for architect: {model.model if model else None}')
          
          dag_builder = DAGBuilder()
          dag = dag_builder.build('Create a user authentication system')
          print(f'DAG stages: {dag.get_execution_order()}')
          print('✅ Core components functional')
          "
      
      - name: Test vault client
        run: |
          python3 -c "
          from vault_client import get_vault_client
          client = get_vault_client()
          
          # Test write/read
          result = client.write_note('test/ci-test.md', '# CI Test\n\nThis is a test note.')
          assert result['created'] == True
          
          content = client.read_note('test/ci-test.md')
          assert 'CI Test' in content
          
          # Test search
          results = client.search('CI Test')
          assert len(results) > 0
          
          # Cleanup
          client.delete_note('test/ci-test.md')
          
          print('✅ Vault client CRUD operations work')
          "

  documentation-check:
    name: Documentation Accuracy
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Check documentation accuracy
        run: |
          python3 << 'EOF'
          import re
          
          checks = [
              ("SWARM-EVALUATION.md", r"9 Workers", "Should be 10 Workers"),
              ("SWARM-EVALUATION.md", r"679 (skill|مهارة)", "Outdated skill count"),
              ("README.md", r"Anthropic 50%|OpenAI 40%|Google 10%", "Outdated model provider claim"),
          ]
          
          print("DOCUMENTATION ACCURACY CHECK")
          print("="*60)
          
          all_pass = True
          for filepath, pattern, expected in checks:
              try:
                  with open(filepath) as f:
                      content = f.read()
                  if re.search(pattern, content):
                      print(f"❌ {filepath}: Found outdated '{pattern}' - {expected}")
                      all_pass = False
                  else:
                      print(f"✅ {filepath}: No outdated '{pattern}' found")
              except FileNotFoundError:
                  print(f"⚠️  {filepath}: File not found (may have been moved)")
          
          if all_pass:
              print("\n✅ All documentation checks PASSED")
          else:
              print("\n❌ Some documentation checks FAILED")
              exit(1)
          EOF

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [lint-and-test, e2e-test, documentation-check]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
