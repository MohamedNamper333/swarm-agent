name: Production Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production verification toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: Run fail-closed production gate
        run: python scripts/run_production_gate.py --report artifacts/production-gate.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-evidence
          path: artifacts/production-gate.json
