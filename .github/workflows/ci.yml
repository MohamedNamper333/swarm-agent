name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov
          pip install -e .[dev]

      - name: Run Ruff (lint)
        run: |
          ruff check swarm tests --output-format=github

      - name: Run MyPy (type check)
        run: |
          mypy swarm --strict --show-error-codes --no-error-summary

      - name: Run Import Linter
        run: |
          pip install import-linter
          import-linter --config .importlinter.yml

  # ============================================================
  # UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pytest pytest-asyncio pytest-cov pytest-mock
          pip install -e .[dev]

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v --tb=short \
            --cov=swarm \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not slow and not integration"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  # ============================================================
  # INTEGRATION TESTS (with testcontainers)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: swarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: ["9092:9092"]
        options: >-
          --health-cmd="kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports: ["2181:2181"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pytest pytest-asyncio pytest-cov pytest-mock
          pip install testcontainers
          pip install -e .[dev]

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U test
          redis-cli -h localhost -p 6379 ping

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short \
            --cov=swarm \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -m "integration"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/swarm_test
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  # ============================================================
  # SECURITY TESTS (SAST/DAST/Dependency/Secrets/Container)
  # ============================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install -U pip
          pip install bandit semgrep gitleaks trivy safety pip-audit

      - name: Run SAST (Bandit)
        run: |
          bandit -r swarm -f json -o bandit-report.json || true
          bandit -r swarm --format txt --severity-level medium --confidence-level medium

      - name: Run SAST (Semgrep)
        run: |
          semgrep --config=auto --config=p/security-audit swarm --json=semgrep-report.json || true
          semgrep --config=auto --config=p/security-audit swarm

      - name: Run Secrets Scan (Gitleaks)
        run: |
          gitleaks detect --source=. --verbose --report-format=json --report-path=gitleaks-report.json || true
          gitleaks detect --source=. --verbose

      - name: Run Dependency Scan (Safety + pip-audit)
        run: |
          safety check --json --output safety-report.json || true
          safety check
          pip-audit --desc --format=json --output=pip-audit-report.json || true
          pip-audit --desc

      - name: Run Container Scan (Trivy)
        run: |
          trivy fs --format json --output trivy-fs-report.json . || true
          trivy fs --severity HIGH,CRITICAL .

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            gitleaks-report.json
            safety-report.json
            pip-audit-report.json
            trivy-fs-report.json

  # ============================================================
  # CONTAINER SCAN
  # ============================================================
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t swarm-agent:test .

      - name: Scan Docker image (Trivy)
        run: |
          trivy image --format json --output trivy-image-report.json swarm-agent:test || true
          trivy image --severity HIGH,CRITICAL swarm-agent:test

      - name: Upload container scan report
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: trivy-image-report.json

  # ============================================================
  # BUILD & PUSH DOCKER
  # ============================================================
  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, unit-tests, integration-tests, security-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/swarm-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # DEPLOY TO STAGING (ArgoCD)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging via ArgoCD
        run: |
          argocd app sync swarm-staging --prune --auto-prune
          argocd app wait swarm-staging --timeout 300
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_INSECURE: "true"

  # ============================================================
  # DEPLOY TO PRODUCTION (ArgoCD - Manual Approval)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Manual approval for production
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: CTO, SRE-Lead, Platform-Lead
          minimum-approvals: 2
          issue-title: "Production Deployment Approval Required"
          issue-body: |
            **Deployment to Production Requested**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref }}
            - Author: ${{ github.actor }}
            - Image: ${{ secrets.DOCKERHUB_USERNAME }}/swarm-agent:${{ github.sha }}

            Please review the changes and approve if ready for production.

      - name: Deploy to Production via ArgoCD
        run: |
          argocd app sync swarm-production --prune --auto-prune
          argocd app wait swarm-production --timeout 300
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_INSECURE: "true"

      - name: Post-deployment smoke tests
        run: |
          sleep 30
          curl -f https://api.swarm.example.com/health || exit 1
          curl -f https://api.swarm.example.com/ready || exit 1
        env:
          SWARM_API_URL: https://api.swarm.example.com

  # ============================================================
  # QUALITY GATES (Final Check)
  # ============================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, unit-tests, integration-tests, security-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "❌ Lint/Typecheck failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "❌ Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.security-tests.result }}" != "success" ]]; then
            echo "❌ Security tests failed"
            exit 1
          fi
          echo "✅ All quality gates passed"
