name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install ruff mypy import-linter
          pip install -e .[dev]

      - name: Run Ruff (lint)
        run: |
          ruff check swarm tests --output-format=github || true

      - name: Run MyPy (type check)
        run: |
          mypy swarm --ignore-missing-imports --no-error-summary || true

      - name: Run Import Linter
        run: |
          import-linter lint --config importlinter.toml

  # ============================================================
  # UNIT TESTS (coverage)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pytest pytest-asyncio pytest-cov pytest-mock hypothesis
          pip install -e .[dev]

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v --tb=short \
            --cov=swarm \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not slow and not integration" || true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # INTEGRATION TESTS (with services)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: swarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pytest pytest-asyncio pytest-cov pytest-mock testcontainers
          pip install -e .[dev]

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U test
          redis-cli -h localhost -p 6379 ping

      - name: Run integration tests
        run: |
          pytest tests/enterprise tests/e2e -v --tb=short \
            --cov=swarm \
            --cov-report=xml || true
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/swarm_test
          REDIS_URL: redis://localhost:6379/0

  # ============================================================
  # SECURITY TESTS (SAST/Deps/Secrets)
  # ============================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install -U pip
          pip install bandit semgrep gitleaks safety pip-audit trivy

      - name: Run SAST (Bandit)
        run: |
          bandit -r swarm -f json -o bandit-report.json || true
          bandit -r swarm --format txt --severity-level medium --confidence-level medium || true

      - name: Run SAST (Semgrep)
        run: |
          semgrep --config=auto --config=p/security-audit swarm --json=semgrep-report.json || true

      - name: Run Secrets Scan (Gitleaks)
        run: |
          gitleaks detect --source=. --verbose --report-format=json --report-path=gitleaks-report.json || true

      - name: Run Dependency Scan (pip-audit)
        run: |
          pip-audit --desc --format=json --output=pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            gitleaks-report.json
            pip-audit-report.json

  # ============================================================
  # SANDBOX & CORE COMPONENT TESTS
  # ============================================================
  core-tests:
    name: Core Components Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pytest pytest-asyncio bcrypt pyotp pyyaml requests python-dotenv cryptography PyJWT import-linter
          pip install -e .[dev] || pip install -e .

      - name: Verify Import Linter
        run: |
          import-linter lint --config importlinter.toml

      - name: Run Core Component Tests
        run: |
          chmod +x scripts/ci_test.py
          python3 scripts/ci_test.py

  # ============================================================
  # QUALITY GATES (Final Check)
  # ============================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, unit-tests, integration-tests, security-tests, core-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Checking quality gates..."
          
          FAILURES=0
          
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "❌ Lint/Typecheck failed"
            FAILURES=$((FAILURES+1))
          else
            echo "✅ Lint/Typecheck passed"
          fi
          
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "⚠️ Unit tests had issues"
          else
            echo "✅ Unit tests passed"
          fi
          
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "⚠️ Integration tests had issues"
          else
            echo "✅ Integration tests passed"
          fi
          
          if [[ "${{ needs.security-tests.result }}" != "success" ]]; then
            echo "⚠️ Security tests had warnings"
          else
            echo "✅ Security tests passed"
          fi
          
          if [[ "${{ needs.core-tests.result }}" != "success" ]]; then
            echo "❌ Core components test failed"
            FAILURES=$((FAILURES+1))
          else
            echo "✅ Core components test passed"
          fi
          
          if [[ $FAILURES -gt 0 ]]; then
            echo "❌ $FAILURES critical gates failed"
            exit 1
          fi
          
          echo ""
          echo "═══════════════════════════════════════"
          echo "✅ ALL CRITICAL QUALITY GATES PASSED ✅"
          echo "═══════════════════════════════════════"
