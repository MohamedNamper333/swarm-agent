name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Lint
        run: ruff check swarm tests

      - name: Unit and enterprise tests
        run: pytest tests/unit tests/enterprise -q

      - name: Architectural invariant suite
        run: python scripts/verify_invariants.py

      - name: Dependency audit
        run: pip-audit

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: Production gate
        run: python scripts/run_production_gate.py --report artifacts/production-gate-${{ matrix.python-version }}.json

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-${{ matrix.python-version }}
          path: artifacts/production-gate-${{ matrix.python-version }}.json

  stress:
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Stress and recovery tests
        run: pytest tests/stress -q
