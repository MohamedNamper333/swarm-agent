# Staging Environment Values
global:
  environment: staging
  imagePullPolicy: IfNotPresent

swarmMaster:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

governance:
  enabled: true
  replicaCount: 2

orchestration:
  enabled: true
  replicaCount: 2

memory:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 10Gi

observability:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 10Gi

routing:
  enabled: true
  replicaCount: 2

policy:
  enabled: true
  replicaCount: 2

state:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 5Gi

artifact:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: 10Gi

audit:
  enabled: true
  replicaCount: 2

budget:
  enabled: true
  replicaCount: 2

execution:
  enabled: true
  replicaCount: 2
  sandbox:
    enableCgroups: true
    enableNamespaces: true

security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  securityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

monitoring:
  enabled: true
  
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: staging.swarm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: swarm-staging-tls
      hosts:
        - staging.swarm.example.com

# DR Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 7

chaos:
  enabled: true  # Enable chaos engineering in staging
