[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-agent"
version = "0.4.0"
description = "Distributed multi-agent orchestration runtime with constitutional governance, plugin extensibility, and live observability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mohamed Namper", email = "swarm@namper.dev" }]
keywords = ["agents", "orchestration", "dag", "swarm", "constitutional-ai", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "mypy>=1.7",
  "ruff>=0.1.0",
  "httpx>=0.25",
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
vault = [
  "flask>=3.0",
]
all = ["swarm-agent[dashboard,vault,dev]"]

[project.urls]
Homepage = "https://github.com/MohamedNamper333/swarm-agent"
Issues = "https://github.com/MohamedNamper333/swarm-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm*"]
exclude = ["tests*", "examples*", "dashboard*", "templates*", "design-system*", "docs*"]

[tool.setuptools.package-data]
swarm = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit", "tests/live", "tests/stress", "tests/e2e", "tests/enterprise"]
addopts = [
  "-ra",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["swarm"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING",
]
