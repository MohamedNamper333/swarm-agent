# Import Linter Configuration for Swarm Agent
# Enforces architectural layers and prevents circular imports

root_package: swarm

contracts:
  # Layer architecture: foundation -> core -> enterprise -> applications
  - name: "Layer Architecture"
    type: layers
    layers:
      - "swarm.enterprise.core.foundation"
      - "swarm.enterprise.core.auth"
      - "swarm.enterprise.core.budget"
      - "swarm.enterprise.core.routing"
      - "swarm.enterprise.core.policy"
      - "swarm.enterprise.core.plane"
      - "swarm.enterprise.core.orchestration"
      - "swarm.enterprise.core.execution"
      - "swarm.enterprise.core.observability"
      - "swarm.enterprise.core.job"
      - "swarm.enterprise.core.orchestration"
      - "swarm.enterprise.core.memory"
      - "swarm.enterprise.board"
      - "swarm.enterprise.csuite"
      - "swarm.enterprise.code"
      - "swarm.enterprise.design"
      - "swarm.enterprise.video"
      - "swarm.enterprise.research"
      - "swarm.enterprise.data"
      - "swarm.enterprise.language"
      - "swarm.enterprise.knowledge"
      - "swarm.enterprise.safety"
      - "swarm.enterprise.swarm_master"
    containers:
      - "swarm"

  # No circular dependencies between any packages
  - name: "No Circular Dependencies"
    type: independence
    modules:
      - "swarm.enterprise.core.foundation"
      - "swarm.enterprise.core.auth"
      - "swarm.enterprise.core.budget"
      - "swarm.enterprise.core.routing"
      - "swarm.enterprise.core.policy"
      - "swarm.enterprise.core.plane"
      - "swarm.enterprise.core.orchestration"
      - "swarm.enterprise.core.execution"
      - "swarm.enterprise.core.observability"
      - "swarm.enterprise.core.job"
      - "swarm.enterprise.core.memory"
      - "swarm.enterprise.board"
      - "swarm.enterprise.csuite"
      - "swarm.enterprise.code"
      - "swarm.enterprise.design"
      - "swarm.enterprise.video"
      - "swarm.enterprise.research"
      - "swarm.enterprise.data"
      - "swarm.enterprise.language"
      - "swarm.enterprise.knowledge"
      - "swarm.enterprise.safety"
    containers:
      - "swarm"

  # SwarmMaster should not be imported by lower layers
  - name: "SwarmMaster Independence"
    type: forbidden
    imports:
      - importer: "swarm.enterprise.core.*"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.board"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.csuite"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.swarm_master"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.swarm_master"
    containers:
      - "swarm"

  # Departments should not import from each other directly
  - name: "Department Independence"
    type: forbidden
    imports:
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.code"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.design"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.video"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.research"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.data"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.knowledge"
      - importer: "swarm.enterprise.language"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.knowledge"
        imported: "swarm.enterprise.safety"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.code"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.design"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.video"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.research"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.data"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.language"
      - importer: "swarm.enterprise.safety"
        imported: "swarm.enterprise.knowledge"
    containers:
      - "swarm"

  # Tests should not be imported by source code
  - name: "Tests Independence"
    type: forbidden
    imports:
      - importer: "swarm"
        imported: "tests"
    containers:
      - "swarm"