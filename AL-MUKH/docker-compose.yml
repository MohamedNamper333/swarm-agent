version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mukh-meilisearch
    ports:
      - "7700:7700"
    volumes:
      - ./search:/meili_data
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - mukh-network

  redis:
    image: redis:7-alpine
    container_name: mukh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    networks:
      - mukh-network

volumes:
  redis-data:

networks:
  mukh-network:
    driver: bridge